version = 0.1

# Serverless Events Observability — build, package, and publish to the AWS
# Serverless Application Repository (SAR).
#
# Usage:
#   sam build --use-container
#   sam package --output-template-file packaged.yaml \
#       --s3-bucket <your-sar-artifact-bucket>
#   sam publish --template packaged.yaml --region <region>

[default.build.parameters]
use_container = true

[default.package.parameters]
# Replace with an S3 bucket you own in the target region. SAR reads the code
# artifacts from here at publish time, so the bucket policy must allow SAR access
# (serverlessrepo.amazonaws.com) — see the SAR publishing docs.
output_template_file = "packaged.yaml"

[default.publish.parameters]
# region is passed on the command line: sam publish --region <region>
